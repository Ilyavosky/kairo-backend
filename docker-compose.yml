services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kairo_test
    ports:
      - "5432:5432"
    volumes:
      - kairo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kairo_pgdata:
